# `docker compose up` -> full app with seed data at http://localhost:3000
# `make dev`          -> only postgres + mailpit here; apps run on the host with hot reload.
name: aifirst-events

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aifirst
      POSTGRES_PASSWORD: aifirst
      POSTGRES_DB: aifirst
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aifirst -d aifirst']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '8025:8025' # web UI + REST API
      - '1025:1025' # SMTP
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://aifirst:aifirst@postgres:5432/aifirst
      API_PORT: '4000'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: AI First Events <events@aifirst.local>
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  pgdata:
